services:
  db:
    image: postgres:15-alpine
    container_name: pitchdeck-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pitchdeck_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First boot: runs init.sql (canonical bootstrap per implementation plan)
      - ./pitchdeck-api/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pitchdeck_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pitchdeck-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pitchdeck.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  pgdata:
