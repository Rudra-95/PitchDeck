services:
  # Node.js Express Backend API (Web Service)
  - type: web
    name: pitchdeck-api
    env: node
    plan: free
    rootDir: pitchdeck-api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # You will paste your Neon Database URL here in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false # You will paste your Groq API key here

  # Vite React Frontend (Static Site)
  - type: web
    name: pitchdeck-web
    env: static
    plan: free
    rootDir: pitchdeck-web
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # You will point this to the pitchdeck-api URL
