services:
  # 1. Managed PostgreSQL Database
  - type: psql
    name: pitchdeck-db
    plan: free

  # 2. Node.js Express Backend API
  - type: web
    name: pitchdeck-api
    env: node
    plan: free
    rootDir: pitchdeck-api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pitchdeck-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false # You will paste your API key in the Render dashboard

  # 3. Vite React Frontend
  - type: web
    name: pitchdeck-web
    env: static
    plan: free
    rootDir: pitchdeck-web
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # You will set this in the Render dashboard to point to pitchdeck-api
