<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Warm cream background -->
  <rect width="64" height="64" rx="12" fill="#FCEFD8"/>

  <g transform="translate(32,32) rotate(-45) translate(-32,-32)">
    <g fill="none" stroke="#E05A00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

      <!-- Rocket body: tall capsule pointing up -->
      <path d="M32 10
               C26 10 22 14 22 20
               L22 38
               C22 38 27 42 32 42
               C37 42 42 38 42 38
               L42 20
               C42 14 38 10 32 10 Z"/>

      <!-- Nose tip rounded -->
      <path d="M26 20 C26 14 38 14 38 20" stroke-width="0" fill="#E05A00" opacity="0"/>

      <!-- Porthole window -->
      <circle cx="32" cy="26" r="5"/>

      <!-- Left fin -->
      <path d="M22 34 L14 42 L22 40"/>

      <!-- Right fin -->
      <path d="M42 34 L50 42 L42 40"/>

      <!-- Flame exhaust - left -->
      <path d="M27 42 Q24 50 26 55 Q29 49 31 46"/>

      <!-- Flame exhaust - right -->
      <path d="M37 42 Q40 50 38 55 Q35 49 33 46"/>

    </g>
  </g>
</svg>
